matter:
  storage: /data/matter  # persistent Matter identity, fabric keys, endpoint numbers
  # port: 5540           # Matter UDP port (default 5540); env: MATTER_PORT

admin:
  port: 8081             # admin UI/API HTTP port (default 8081); env: ADMIN_PORT
  # host: "127.0.0.1"    # bind address (default: all interfaces); env: ADMIN_HOST
  # maxBodyBytes: 65536  # max request body size in bytes (default 64 KiB); env: ADMIN_MAX_BODY_BYTES

# mqtt:
#   broker: "mqtt://user:password@192.0.2.10:1883"

